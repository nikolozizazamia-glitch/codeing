<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="icon" type="image/x-icon" href="images/images (2).png" />
  </head>
  <body>
    <h1>Contact Me</h1>
    <header>
        <nav>
            <ul>
                <li><img src="images/images.png" alt="Home Icon" width="25" height="25" /> <a href= "home.html" target="_blank">Home</a></li>
                <li><img src="images/images (1).png" alt="About Icon" width="25" height="25" /> <a href= "about.html" target="_blank">About</a></li>
                <li><img src="images/images (2).png" alt="Contact Icon" width="25" height="25" /> <a href= "contact1.html" target="_blank">Contact</a></li>
            </ul>
        </nav>
        <img src="images/images (1).jpg" alt="Contact Me" width="200" height="150" />
            <main>
        <form>
            <label for="name">Name:</label>
            <input
            type="text"
            id="name"
            name="name"
            required
            />
            <br />
            <br />

            <label for="email">Email:</label>
            <input
            type="email"
            id="email"
            name="email"
            required
            />
            <br />
            <br />

            <label for="password">Password:</label>
            <input
            type="password"
            id="password"
            name="password"
            required
            />
            <br />
            <br />

            <select name="gender" id="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>    
            </select>
            <br />
            <br />

            <button type="submit">Submit</button>
        </form>
    </header>

</html>
